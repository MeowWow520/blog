  - content: |
      现在是 9 月 11 日下午六点钟左右，我在一家星巴克中点了一杯美式然后写下了这一篇日记。这大概算是人生第一次写日记这种东西 ......
      &nbsp;&nbsp;&nbsp;
      从起源说起的话，应该是大二的某一个时间，那次是我给家里打电话，提到了自己未来的想法。**我自己的意愿是考研**，因为电气工程专业大多是强电相关，我不希望自己进去强电相关的职位，而是自动化或者 PLC 相关的职业。家里的那两位也是不希望我进去强电相关的职位置，怕我今天入职明天入葬，因此也希望我考研提高学历。
      &nbsp;&nbsp;&nbsp;
      开始准备考研是 8 月 28 号，我去学校的前一天。在这之前考研在我的脑海中只是一个“动词”。那一天我认识到这是一个相当复杂的选拔形式。一开始是**迷茫**的，不知道要去哪里，去什么学校，等等。那几天基本上也是像今天一样，走进一家星巴克，然后开始漫长的查阅。第一次来这里点了一杯大杯拿铁，搜了很多很多攻略视频，喝完了也没有弄明白怎么考研。
      &nbsp;&nbsp;&nbsp;
      周四的一个下午，我发现如果我不和**家里那两位**一起合计的话，我是不知道如何前进的。所以那天晚上，我和**家里的那两位**打了一通长达 30min 的通话。随后的 3 ~ 4 天又是接连打了几次电话之后。
      &nbsp;&nbsp;&nbsp;
      最终确定了要考取**西安理工大学**的电气工程学硕。从那之后我便开始忙碌了起来，在学校的一个角落找了一个位置开始备考。下面这几张图就是我备考的环境。
      &nbsp;&nbsp;&nbsp;
      今天我有几件事要做：1、写下这个日记的第一篇；2、做一个资料购买的表格，来统计自己在考研资料和机构报名上花费的金额。
      &nbsp;&nbsp;&nbsp;
      回见(~~话说这是写给谁看的~~)
